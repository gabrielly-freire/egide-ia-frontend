<div class="sidebar" style="background-color: var(--bg-card); border-right: 1px solid var(--border-color); height: 100vh; width: 260px; display: flex; flex-direction: column;">
  <div class="logo-container" style="padding: 24px; border-bottom: 1px solid var(--border-color);">
    <h2 style="color: var(--text-main); font-weight: 700; margin: 0; font-size: 1.5rem;">ÉGIDE</h2>
  </div>

  <nav style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
    <a routerLink="/home" 
       routerLinkActive="active-link"
       class="nav-item">
      <i class="pi pi-home"></i>
      <span>Início</span>
    </a>

    <a routerLink="/dashboard" 
       routerLinkActive="active-link"
       class="nav-item">
      <i class="pi pi-chart-bar"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/manifestacoes" 
       routerLinkActive="active-link"
       class="nav-item">
      <i class="pi pi-list"></i>
      <span>Manifestações</span>
    </a>

    <a routerLink="/cadastrar-manifestacao" 
       routerLinkActive="active-link"
       class="nav-item">
      <i class="pi pi-plus-circle"></i>
      <span>Nova Manifestação</span>
    </a>
  </nav>

  <div class="user-footer" style="padding: 16px; border-top: 1px solid var(--border-color);">
    <button class="nav-item" style="width: 100%; border: none; background: transparent; cursor: pointer; color: #ef4444;">
      <i class="pi pi-sign-out"></i>
      <span>Sair</span>
    </button>
  </div>
</div>
